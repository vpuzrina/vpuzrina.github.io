# Deploys https://vpuzrina.github.io from main. Runs only on main, so the v2-papers branch
# never touches the live site. STRICT=1 refuses to publish while any [TODO] marker is left.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Chromium prints the CV PDF and renders the Open Graph images after the build
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Build (strict: no [TODO] markers, banned words or third-party resources)
        run: npm run build
        env:
          STRICT: '1'
      - name: Check the build
        run: |
          test -f dist/varvara-puzrina-cv.pdf
          test -f dist/resume.pdf
          node tests/e2e/links.mjs
          npx html-validate "dist/**/*.html"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
