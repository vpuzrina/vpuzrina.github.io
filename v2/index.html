<!doctype html>
<html lang="en" data-variant="v2" data-accent="claret">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#FFF1E5" />

      try {
        var a = localStorage.getItem('preview-accent');
        if (a === 'claret' || a === 'teal') document.documentElement.dataset.accent = a;
      } catch (e) {}
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
