<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FAFAF7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0F141D" />
    <script>
      // Apply a saved theme before first paint; without one, CSS follows prefers-color-scheme
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!--head-->
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <a class="skip" href="#research">Skip to research</a>
    <!--app-->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
